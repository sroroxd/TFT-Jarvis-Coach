name: Publish directly installable JARVIS APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/build.gradle"
      - ".github/signing/jarvis-release.p12.asc"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check signing initialization
        id: signing
        run: |
          if [ -s .github/signing/jarvis-release.p12.asc ] && [ -s .github/signing/cert-sha256.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Signing not initialized. Add secret JARVIS_SIGNING_PASSWORD and run Initialize JARVIS signing key once; no APK has been released."
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing identity
        if: steps.signing.outputs.ready == 'true'
        env:
          JARVIS_SIGNING_PASSWORD: ${{ secrets.JARVIS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#JARVIS_SIGNING_PASSWORD}" -lt 32 ]; then
            echo "::error::Missing or weak repository Actions secret JARVIS_SIGNING_PASSWORD."
            exit 1
          fi
          printf '%s' "$JARVIS_SIGNING_PASSWORD" | \
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --output "$RUNNER_TEMP/jarvis-release.p12" \
              --decrypt .github/signing/jarvis-release.p12.asc
          actual=$(keytool -list -v -keystore "$RUNNER_TEMP/jarvis-release.p12" \
            -storetype PKCS12 -storepass "$JARVIS_SIGNING_PASSWORD" \
            -alias jarvis-release | sed -n 's/.*SHA256: //p' | head -n 1)
          expected=$(cat .github/signing/cert-sha256.txt)
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate fingerprint mismatch. Refusing to publish a non-upgradable APK."
            exit 1
          fi
          echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.p12" >> "$GITHUB_ENV"
      - name: Run tests and build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          JARVIS_SIGNING_PASSWORD: ${{ secrets.JARVIS_SIGNING_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace
      - name: Verify signed APK and classify version
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)
          if [[ ! "$VERSION" =~ ^0\.9\.[0-9]+(-[a-z0-9][a-z0-9.-]*)?$ ]] || [ -z "$CODE" ] || [ "$CODE" -le 29 ]; then
            echo "::error::Release version or monotonically increasing versionCode invalid."
            exit 1
          fi
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android APK signature verifier unavailable."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-verification.txt"
          # Verify actual APK identity, not just Gradle source declarations.
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/release-badging.txt"
          grep -q "^package: name='com.pete.tftjarvis' versionCode='$CODE' versionName='$VERSION'" "$RUNNER_TEMP/release-badging.txt"
          grep -q "launchable-activity: name='com.pete.tftjarvis.JarvisActivity'" "$RUNNER_TEMP/release-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/release-badging.txt"; then
            echo "::error::Release APK unexpectedly debuggable."
            exit 1
          fi

          # Fingerprints are public certificate identifiers, not the signing key.
          # Parse the exact signer digest from apksigner; never mask a real mismatch.
          # Current Android SDK apksigner labels the verified v2 certificate as
          # "V2 Signer: certificate SHA-256 digest:", not "Signer #1 ...".
          # Extract only the certificate digest, never the public-key digest.
          ACTUAL=$(sed -nE 's/^[[:space:]]*V[0-9]+ Signer: certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+)[[:space:]]*$/\1/p' "$RUNNER_TEMP/apk-verification.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d ':[:space:]' < .github/signing/cert-sha256.txt | tr '[:upper:]' '[:lower:]')
          echo "Stored certificate SHA-256: $EXPECTED"
          echo "APK signer SHA-256: ${ACTUAL:-missing}"
          if [[ ! "$ACTUAL" =~ ^[0-9a-f]{64}$ ]] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate does not match the permanent signing identity. Refusing release."
            exit 1
          fi
          # An experimental APK is not a production release merely because CI passed.
          echo "JARVIS_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-experimental* || "$VERSION" == *-preview* || "$VERSION" == *-test* ]]; then
            echo "JARVIS_EXPERIMENTAL=true" >> "$GITHUB_ENV"
            echo "::notice::Experimental build $VERSION verified; archive in Actions only. No GitHub Release will be created."
          else
            echo "JARVIS_EXPERIMENTAL=false" >> "$GITHUB_ENV"
          fi
      - name: Retain verified signed APK as a CI artifact (not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-verified-signed-apk-${{ github.run_id }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish eligible version to GitHub Releases
        if: success() && env.JARVIS_EXPERIMENTAL == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$JARVIS_RELEASE_VERSION"
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Version $TAG is already published; increase versionName and versionCode."
            exit 1
          fi
          cp "$APK" "JARVIS-$VERSION.apk"
          extra=()
          if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
          NOTES="docs/releases/$VERSION.md"
          if [ -s "$NOTES" ]; then
            note_args=(--notes-file "$NOTES")
          else
            note_args=(--notes "Signed Android APK; device QA not guaranteed. For a pre-release, treat all AI and audio functions as experimental. Updates require matching signature and higher versionCode.")
          fi
          gh release create "$TAG" "JARVIS-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "JARVIS $VERSION" \
            "${note_args[@]}" "${extra[@]}"
