name: Publish JARVIS 0.8.0 APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-080.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-0.8.0-perception-alpha.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.0-perception-alpha \
            JARVIS-0.8.0-perception-alpha.apk \
            --title "JARVIS 0.8.0 Perception Alpha" \
            --notes "Verified Perception Layer: lokale HUD-Erkennung für Stage, Level, Gold und HP vor der strategischen KI."
