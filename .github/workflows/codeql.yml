name: JARVIS CodeQL security scan (free public repo)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 04 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: jarvis-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Scan Java source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Initialise CodeQL (Java only)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - name: Scan for vulnerability patterns
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
