name: JARVIS 0.9 Android CI
on:
  push:
    branches: [ "feature/jarvis-090-perception" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Static Android lint
        run: gradle --no-daemon lintDebug --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Audit the published 0.9.0 APK binary (not just source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-apk"
          gh release download v0.9.0-beta1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'JARVIS-0.9.0-beta1.apk' \
            --dir "$RUNNER_TEMP/published-apk"
          APK="$RUNNER_TEMP/published-apk/JARVIS-0.9.0-beta1.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          ACTUAL_DIGEST=$(sha256sum "$APK" | cut -d' ' -f1)
          RELEASE_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.9.0-beta1" \
            --jq '.assets[] | select(.name=="JARVIS-0.9.0-beta1.apk") | .digest' | sed 's/^sha256://')
          test -n "$RELEASE_DIGEST"
          test "$ACTUAL_DIGEST" = "$RELEASE_DIGEST"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/published-cert.txt"
          # apksigner reports the signing scheme (V2) in modern SDKs.
          CERT=$(sed -nE 's/^[[:space:]]*V[0-9]+ Signer: certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+)[[:space:]]*$/\1/p' "$RUNNER_TEMP/published-cert.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(tr -d ':[:space:]' < .github/signing/cert-sha256.txt | tr '[:upper:]' '[:lower:]')
          test -n "$CERT" && test "$CERT" = "$EXPECTED"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/published-badging.txt"
          grep -q "^package: name='com.pete.tftjarvis' versionCode='30' versionName='0.9.0-beta1'" "$RUNNER_TEMP/published-badging.txt"
          grep -q "launchable-activity: name='com.pete.tftjarvis.MainActivity'" "$RUNNER_TEMP/published-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/published-badging.txt"; then
            echo "::error::Published 0.9.0 APK is unexpectedly debuggable"
            exit 1
          fi
          echo "Published APK verified: $ACTUAL_DIGEST, signer=$CERT, versionCode=30"
      - name: Create throwaway signing identity for CI only
        run: |
          set -euo pipefail
          TEMP_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release.p12" -storetype PKCS12 \
            -alias jarvis-release -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=JARVIS CI ONLY, O=Automated Test, C=DE" \
            -storepass "$TEMP_PASSWORD" -keypass "$TEMP_PASSWORD" >/dev/null
          echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.p12" >> "$GITHUB_ENV"
          echo "JARVIS_SIGNING_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate encrypted signing-key roundtrip
        run: |
          set -euo pipefail
          printf '%s' "$JARVIS_SIGNING_PASSWORD" | \
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --cipher-algo AES256 --armor --symmetric \
              --output "$RUNNER_TEMP/ci-release.p12.asc" "$JARVIS_KEYSTORE_PATH"
          printf '%s' "$JARVIS_SIGNING_PASSWORD" | \
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --output "$RUNNER_TEMP/ci-release-restored.p12" \
              --decrypt "$RUNNER_TEMP/ci-release.p12.asc"
          cmp "$JARVIS_KEYSTORE_PATH" "$RUNNER_TEMP/ci-release-restored.p12"
      - name: Build and validate signed release APK (CI identity, never published)
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Validate actual APK package, launchability and release flags
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/jarvis-badging.txt"
          PKG=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" "$RUNNER_TEMP/jarvis-badging.txt" | head -n 1)
          APK_CODE=$(sed -nE "s/^package: .*versionCode='([0-9]+)'.*/\1/p" "$RUNNER_TEMP/jarvis-badging.txt" | head -n 1)
          APK_NAME=$(sed -nE "s/^package: .*versionName='([^']+)'.*/\1/p" "$RUNNER_TEMP/jarvis-badging.txt" | head -n 1)
          SOURCE_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)
          SOURCE_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)
          test "$PKG" = "com.pete.tftjarvis"
          test "$APK_CODE" = "$SOURCE_CODE"
          test "$APK_NAME" = "$SOURCE_NAME"
          grep -q "launchable-activity: name='com.pete.tftjarvis.MainActivity'" "$RUNNER_TEMP/jarvis-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/jarvis-badging.txt"; then
            echo "::error::Production APK is debuggable."
            exit 1
          fi
          echo "Valid installable APK metadata: $PKG / $APK_NAME ($APK_CODE)"
      - name: Ensure no plaintext signing keys are committed
        run: |
          if git ls-files '*.p12' '*.jks' '*.keystore' | grep .; then
            echo "::error::Plaintext signing key tracked in Git!"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ci-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
