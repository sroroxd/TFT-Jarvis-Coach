name: Publish JARVIS 0.8.2 APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-082.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-0.8.2-header-hotfix.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.2-header-hotfix \
            JARVIS-0.8.2-header-hotfix.apk \
            --title "JARVIS 0.8.2 Header Hotfix" \
            --notes "Fixes malformed API credential/header values. Invalid multiline credentials are rejected before network calls with a clear in-app message."
