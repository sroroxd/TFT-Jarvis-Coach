plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pete.tftjarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pete.tftjarvis'
        minSdk 29
        targetSdk 35
        versionCode 30
        versionName '0.9.0-beta1'
    }

    signingConfigs {
        stableRelease {
            def keyPath = System.getenv('JARVIS_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('JARVIS_STORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // Bundled on-device OCR: no network/model download required at runtime.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
