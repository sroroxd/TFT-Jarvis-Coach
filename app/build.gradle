plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pete.tftjarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pete.tftjarvis'
        minSdk 29
        targetSdk 35
        versionCode 20
        versionName '0.7.2-gemini-image-input-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
