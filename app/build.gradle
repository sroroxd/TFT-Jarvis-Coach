plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pete.tftjarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pete.tftjarvis'
        minSdk 29
        targetSdk 35
        versionCode 35
        versionName '0.9.5-beta6'
    }

    // Stable release signing is reused for every subsequent Android APK update.
    signingConfigs {
        stableRelease {
            def keyPath = System.getenv('JARVIS_KEYSTORE_PATH')
            def signingPassword = System.getenv('JARVIS_SIGNING_PASSWORD')
            if (keyPath && signingPassword) {
                storeFile file(keyPath)
                storePassword signingPassword
                keyAlias 'jarvis-release'
                keyPassword signingPassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        debug {
            // Isolated device voice preview; release application ID and signing unchanged.
            applicationIdSuffix '.s24qa2'
            versionNameSuffix '-s24qa2'
        }
        release {
            signingConfig signingConfigs.stableRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // Bundled on-device OCR: no network/model download required at runtime.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
