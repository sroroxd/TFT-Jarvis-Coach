plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pete.tftjarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pete.tftjarvis'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '0.6.2-manual-analysis'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
